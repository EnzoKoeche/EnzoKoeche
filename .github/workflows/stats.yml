# Redesenha assets/stats.svg com os números do momento.
#
# O cartão é commitado no repo de propósito: serviço de terceiro pra isso já
# estava devolvendo 503, e imagem quebrada num perfil é pior que cartão nenhum.
name: stats

on:
  schedule:
    - cron: "17 6 * * 1"   # toda segunda, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/gen_stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  desenhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o cartão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "stats: números da semana"
          git push
